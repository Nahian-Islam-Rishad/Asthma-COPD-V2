# Environment for the NHANES asthma-COPD feature-ablation analysis.
#
#   conda env create -f environment.yml
#   conda activate asthma-copd
#
# Pins are chosen as a mutually compatible set suitable for a methods
# section. Record the exact resolved versions before submission with:
#   conda env export --no-builds > environment.lock.yml

name: asthma-copd

channels:
  - conda-forge

dependencies:
  - python=3.11

  # Core numerical stack.
  # numpy is held below 2.0 because the shap / xgboost pin below is the
  # last combination verified against this notebook. If you move to
  # numpy>=2, bump shap to >=0.46 and re-run the full ablation, since
  # TreeExplainer's shap_values return shape changed across that range
  # (the notebook already handles both the list and 3-D array forms).
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13

  # Modelling.
  # scikit-learn >=1.0 is required for OneHotEncoder.get_feature_names_out,
  # used by get_feature_names().
  - scikit-learn=1.5
  - xgboost=2.1
  - shap=0.45

  # Plotting. Non-interactive backend is fine for the figure cells.
  - matplotlib-base=3.9

  # Notebook execution.
  - jupyterlab=4.2
  - ipykernel=6.29

  # Reading NHANES .xpt files goes through pandas.read_sas, which needs no
  # extra dependency. pyreadstat is listed only if you switch to
  # pd.read_sas(..., engine="pyreadstat") or need SAS value labels.
  # - pyreadstat=1.2